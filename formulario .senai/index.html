
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">

    <!-- CSS próprio -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container mt-5">

        <div class="formulario">

            <h1>Cadastro de usuário</h1>
            <p>Preencha os campos abaixo para se cadastrar.</p>

            <form>

                <div class="mb-3">
                    <p class="fa-regular fa-user"></p>

                    <label for="nome" class="form-label">Nome completo</label>
                    <input type="text" class="form-control" id="nome" placeholder="Digite seu nome">
                </div>

                <div class="mb-3">
                    <i class="fa-solid fa-at"></i>

                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="email" placeholder="Digite seu e-mail">
                </div>

                <div class="mb-3">
                    <label for="senha" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="senha" placeholder="Digite sua senha">
                </div>

                <div class="mb-3">
                    <label for="confirmarSenha"  class="form-label">Confirmar senha</label>
                    <input
                        type="password"
                        class="form-control"
                        id="confirmarSenha"
                        placeholder="Confirme sua senha"
                    
                    >
                </div>
               


                <button type="button" id="confirmar" class="btn btn-primary w-100">
                    Cadastrar
                </button>
                    <p> ver senha</p>

                      <i class="fa-solid fa-lock"></i>
                <div class="col-1">
                <button id="xeroline" type="button" onclick="mostrarSenha()" class="btn btn-primary w-100"> </button>
          
                 </div>

            </form>

        </div>

        <div id="cadastros"></div>

    </div>

    <script src="https://kit.fontawesome.com/4b5b7ca977.js" crossorigin="anonymous"></script>
    <script src="js/script.js"></script>

</body>
</html>
